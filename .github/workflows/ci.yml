name: ck3chronicle tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify repository boundary and full suite
        run: python -B -m pytest -q -p no:cacheprovider
