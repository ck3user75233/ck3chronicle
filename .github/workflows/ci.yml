name: ck3chronicle package checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project-local CI configuration
        run: Copy-Item -LiteralPath config.example.toml -Destination config.toml
      - name: Install
        run: python -m pip install .
      - name: Compile package
        run: python -B -m compileall -q src tools
      - name: Run requirement-derived tests
        run: python -B -m unittest discover -s tests -v
      - name: Verify imports and CLI surface
        run: |
          python -I -B -c "import ck3chronicle; import ck3chronicle.cli"
          ck3chronicle --help
          python -m pip check
