[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ck3chronicle"
version = "0.0.1"
description = "Preserve and triage Crusader Kings III runtime logs and crash evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "ck3chronicle authors" }]
keywords = ["ck3", "crusader-kings", "modding", "logs", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
ck3chronicle = "ck3chronicle.cli:main"
ck3chronicle-learner-release = "template_learning.learner_loader:main"
ck3chronicle-model-release = "ck3chronicle.pipeline.catalog:main"

[tool.setuptools.packages.find]
where = ["src", "tools"]
include = ["ck3chronicle*", "template_learning*"]

[tool.setuptools.package-data]
"template_learning" = ["owner_rules.json"]
"template_learning.parsers" = ["v1/parser.py", "v1/manifest.json", "v1_7/parser.py", "v1_7/manifest.json", "v1_7/recovery_rules.json"]

[tool.setuptools.data-files]
"share/ck3chronicle/learners" = [
  "learners/catalog.json",
]

